version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_customers
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_accounts
    columns:
      - name: account_key
        tests: [unique, not_null]
      - name: account_id
        tests: [unique, not_null]

  - name: dim_orders
    columns:
      - name: order_key
        tests: [unique, not_null]
      - name: order_id
        tests: [unique, not_null]

  - name: dim_transaction_type
    columns:
      - name: transaction_type_key
        tests: [unique, not_null]

  - name: dim_transaction_status
    columns:
      - name: transaction_status_key
        tests: [unique, not_null]

  - name: fact_transactions
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: account_key
        tests:
          - not_null
          - relationships: {to: ref('dim_accounts'), field: account_key}
      - name: order_key
        tests:
          - relationships: {to: ref('dim_orders'), field: order_key}
      - name: customer_key
        tests:
          - relationships: {to: ref('dim_customers'), field: customer_key}
      - name: amount
        tests: [not_null]

  - name: obt_transactions
    columns:
      - name: transaction_id
        tests: [unique, not_null]

  - name: agg_account_daily
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [account_key, date_key, currency]
